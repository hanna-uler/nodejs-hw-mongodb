tags:
  - Contacts
summary: Delete contact by id
operationId: getContact
description: Delete contact by ID from the user's contact list
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
responses:
  '204':
    description: 'Deleted contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 204
            message:
              type: string
              example: Successfully deleted a contact with id 65ca67e7ae7f10c88b598384!
  '404':
    $ref: '../../../components/responses/404.yaml'
